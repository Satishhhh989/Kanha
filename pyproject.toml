[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apps", "core", "sysplatform", "infrastructure"]

[project]
name = "kahna"
version = "0.1.0"
description = "A foundational local AI computer agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=1.3.0",
    "black>=24.4.2",
    "ruff>=0.4.9",
    "mypy>=1.10.0"
]
macos = [
    "pyobjc-core>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "mss>=9.0.2"
]
windows = [
    "pywin32>=306",
    "mss>=9.0.2"
]
browser = [
    "playwright>=1.44.0"
]
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "webrtcvad>=2.0.10",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.1"
]
remote = [
    "aiogram>=3.4.1",
    "aiortc>=1.8.0"
]

[project.scripts]
kahna = "apps.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
